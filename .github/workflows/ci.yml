name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements-dev.txt
      - name: Fast suite (API, database, WebSocket, pipeline, units)
        working-directory: backend
        run: pytest -m "not slow" -q
      - name: Full-stream suite (parity with the original prototype, restart)
        working-directory: backend
        run: pytest -m slow -q

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm test
      - run: npm run build

  e2e:
    name: End-to-end (docker compose)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: ci-only-secret-${{ github.run_id }}-0123456789abcdefghijklmnop
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: CiAdmin12345
      POSTGRES_PASSWORD: ci-db-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r e2e/requirements.txt
      - run: pytest e2e -v
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v
