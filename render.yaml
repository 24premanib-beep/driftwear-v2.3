# Render Blueprint: PostgreSQL + API (Docker) + frontend (static site).
# Render → New → Blueprint → select this repository. Fill the "sync: false" values when prompted.
databases:
  - name: driftwear-db
    databaseName: driftwear
    user: driftwear
    plan: free

services:
  - type: web
    name: driftwear-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: driftwear-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PREDICTION_RATE_LIMIT
        value: "120"
      - key: EVENT_BATCH_MAX
        value: "100"
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        sync: false            # e.g. https://driftwear-web.onrender.com,https://your-app.vercel.app
      # Render's disk is ephemeral: keep model files in S3-compatible storage
      - key: MODEL_STORAGE_BACKEND
        value: s3
      - key: S3_BUCKET
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_REGION
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false

  - type: web
    name: driftwear-web
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false            # e.g. https://driftwear-api.onrender.com
