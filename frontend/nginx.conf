# Rendered by the nginx image's envsubst step: ${BACKEND_URL} comes from the container environment.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 8m;          # backend enforces MAX_UPLOAD_MB itself

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    location = /healthz { access_log off; return 200 "ok\n"; }

    location /api/ {
        proxy_pass ${BACKEND_URL};
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /ws {
        proxy_pass ${BACKEND_URL};
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location ~* ^/(docs|redoc|openapi\.json) { proxy_pass ${BACKEND_URL}; proxy_set_header Host $host; }

    # backend health checks: /health, /health/db, /health/ml, /health/websocket
    location ~ ^/health(/(db|ml|websocket))?$ { access_log off; proxy_pass ${BACKEND_URL}; proxy_set_header Host $host; }

    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }

    location / { try_files $uri /index.html; add_header Cache-Control "no-cache"; }
}
